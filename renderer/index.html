<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Bamboo Copter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="bootSkeleton" class="boot-skeleton" aria-busy="true" aria-label="正在加载">
    <div class="boot-mark">
      <img class="boot-blades" src="../assets/boot-blades.png" alt="">
      <img class="boot-body" src="../assets/boot-body.png" alt="">
    </div>
  </div>
  <nav class="window-nav" aria-label="窗口">
    <button id="toggleSidebar" class="nav-button" type="button" data-tip="显示/隐藏侧边栏" data-keys="⌘B" aria-label="显示/隐藏侧边栏">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
  </nav>
  <aside class="list-pane">
    <div class="list-head"></div>
    <section class="record-board" aria-label="进度">
      <div class="record-head">
        <span>进度</span>
        <span id="recordRatio" class="eyebrow">0/100</span>
      </div>
      <div class="record-stats">
        <button id="filterPass" class="record-stat" type="button"><strong>0</strong><span>通过</span></button>
        <button id="filterFail" class="record-stat" type="button"><strong>0</strong><span>未通过</span></button>
        <button id="filterTodo" class="record-stat" type="button"><strong>0</strong><span>未做</span></button>
      </div>
    </section>
    <label class="problem-search">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.25" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 10.2 13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="problemSearch" type="search" placeholder="搜索题目" aria-label="搜索题目" autocomplete="off" spellcheck="false">
    </label>
    <div id="problemList" class="problem-list"></div>
  </aside>
  <div class="col-resizer" data-pane=".list-pane" data-min="160" data-max="480" title="拖动调整题单宽度"></div>
  <section class="problem-pane">
    <header class="problem-head">
      <div>
        <div id="problemTitle" class="problem-title">选择一道题</div>
      </div>
      <div class="problem-actions">
        <button id="toggleExplain" class="icon-button bar-icon" type="button" data-tip="题解" data-keys="⌘E" aria-label="题解">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3.5c-1-.8-2.3-1.2-3.8-1.2H2.5v9.4h1.8c1.4 0 2.6.4 3.7 1.2 1.1-.8 2.3-1.2 3.7-1.2h1.8V2.3H11.8c-1.5 0-2.8.4-3.8 1.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 3.5v9.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <a id="problemLink" class="icon-button bar-icon" href="https://leetcode.cn/studyplan/top-100-liked/" target="_blank" rel="noreferrer" data-tip="官网题目" aria-label="官网题目">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3.5H4.3A1.3 1.3 0 0 0 3 4.8v6.9A1.3 1.3 0 0 0 4.3 13h6.9A1.3 1.3 0 0 0 12.5 11.7V10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 3.5h3.5V7M12.5 3.5 7.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </header>
    <div id="problemBody" class="problem-body">从左侧选择题目. 题面按热题 100 官网内容加载.</div>
  </section>
  <div class="col-resizer" data-pane=".problem-pane" data-min="280" data-max="860" title="拖动调整题面宽度"></div>
  <main class="work-pane">
    <div class="editor-wrap">
      <div class="editor-bar">
        <div class="editor-corner-guard" aria-hidden="true"></div>
        <button id="toggleChat" class="nav-button" type="button" data-tip="显示/隐藏对话" data-keys="⌘⌥B" aria-label="显示/隐藏对话">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <div class="bar-actions">
          <button id="reviewCode" class="submit-button" type="button" data-tip="提交" data-keys="⌘Enter" aria-label="提交">提交</button>
          <button id="clearCode" class="icon-button bar-icon" type="button" data-tip="清除代码" aria-label="清除代码">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2.4a5.6 5.6 0 1 1-4.7 2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M2.2 2.8v3.2h3.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="formatCode" class="icon-button bar-icon" type="button" data-tip="格式化" data-keys="⌘⇧F" aria-label="格式化">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 3.5h11M2.5 6.5h8M2.5 9.5h11M2.5 12.5h6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <button id="openHistory" class="icon-button bar-icon" type="button" data-tip="提交记录" aria-label="提交记录">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="5.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.8v3.4l2.2 1.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div id="editor"></div>
    </div>
  </main>
  <div class="col-resizer" data-pane=".chat" data-edge="end" data-min="260" data-max="520" title="拖动调整对话宽度"></div>
  <section class="chat">
      <header class="chat-titlebar">
        <span id="chatTitle" class="chat-title">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.142-.081 4.778-2.758a.795.795 0 0 0 .393-.681v-6.737l2.02 1.169a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.495 4.493zM3.6 18.304a4.471 4.471 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.677l5.814 3.354-2.02 1.169a.076.076 0 0 1-.071 0l-4.83-2.787A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855-5.833-3.387L15.12 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zM8.307 12.863l-2.02-1.164a.08.08 0 0 1-.038-.057V6.074a4.5 4.5 0 0 1 7.376-3.454l-.142.081L8.704 5.46a.795.795 0 0 0-.393.681zm1.098-2.366 2.602-1.5 2.608 1.5v2.999l-2.598 1.51-2.607-1.5z"/></svg>
          <span>Codex</span>
        </span>
      </header>
      <div class="messages-wrap">
        <div class="chat-empty-mark" aria-hidden="true">
          <img src="../assets/chat-empty-mark.png" alt="">
        </div>
        <div id="messages" class="messages"></div>
      </div>
      <div id="agentPath" class="agent-path"></div>
      <form id="composer" class="composer">
        <textarea id="chatInput" rows="2" placeholder="问问这道题" title="Enter 发送, Shift+Enter 换行"></textarea>
        <div class="composer-bar">
          <div id="agentNotice" class="agent-notice" hidden>
            <span id="agentNoticeText"></span>
          </div>
          <span id="status" class="status"></span>
          <div class="composer-tools">
            <select id="modelSelect" aria-label="模型"></select>
            <select id="effortSelect" aria-label="推理强度" title="推理强度" hidden></select>
            <button id="fastToggle" class="fast-toggle" type="button" aria-pressed="false" title="开启 Codex fast" hidden>fast</button>
            <button class="send" type="submit" aria-label="发送" data-tip="发送">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2.2v11.2M8 2.2 3.4 6.8M8 2.2l4.6 4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </form>
  </section>
  <div id="explainPip" class="explain-pip is-closed">
    <div class="explain-pip-bar">
      <div id="explainPipDrag" class="explain-pip-drag" title="拖动题解窗">
        <span>题解</span>
      </div>
      <div id="explainPlayer" class="explain-player" hidden>
        <div class="explain-transport" role="group" aria-label="播放控制">
          <button id="explainPause" class="transport-button" type="button" data-tip="暂停" aria-label="暂停">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M5 3.5h2.2v9H5zm3.8 0H11v9H8.8z" fill="currentColor"/></svg>
          </button>
          <button id="explainReplay" class="transport-button" type="button" data-tip="重播" aria-label="重播">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 2.4a5.6 5.6 0 1 1-4.7 2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2.2 2.8v3.2h3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="explainRate" class="transport-button" type="button" data-tip="播放倍率 1x" aria-label="播放倍率 1x" data-rate="1">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <path d="M8 2.4A6.1 6.1 0 0 0 2.4 12h11.2A6.1 6.1 0 0 0 8 2.4z" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <g data-rate-needle transform="rotate(-28 8 8.2)">
                <path d="M8 8.2 11.2 4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <circle cx="8" cy="8.2" r="1.2" fill="currentColor"/>
              </g>
            </svg>
          </button>
        </div>
      </div>
      <button id="closeExplain" class="transport-button explain-close" type="button" data-tip="关闭" aria-label="关闭">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M4.2 4.2 11.8 11.8M11.8 4.2 4.2 11.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="explainView" class="explain-pip-view">
      <div id="explainBody"></div>
    </div>
    <div id="explainCaption" class="explain-pip-caption"></div>
    <div id="explainPipResize" class="explain-pip-handle" title="等比例缩放"></div>
  </div>
  <dialog id="historyDialog">
    <div class="dialog-head">
      <strong>提交记录</strong>
      <button id="closeHistory" class="icon-button" type="button" data-tip="关闭" aria-label="关闭">关闭</button>
    </div>
    <div class="history-layout">
      <div id="historyList" class="history-list"></div>
      <pre id="historyCode"></pre>
    </div>
  </dialog>
  <script src="vendor/vs/loader.js"></script>
  <script src="java-complete.js"></script>
  <script src="app.js"></script>
</body>
</html>
