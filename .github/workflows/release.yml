# 版本标签触发打包并发布; 手动运行仅打包验证.
name: 发布安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            args: --mac dmg --arm64
          - os: windows-latest
            label: Windows
            args: --win nsis
          - os: ubuntu-24.04
            label: Linux
            args: --linux AppImage
    steps:
      - uses: actions/checkout@v5
      - name: 安装 pnpm
        shell: bash
        run: |
          npm install --prefix "${RUNNER_TEMP}/pnpm-bootstrap" pnpm@10
          echo "${RUNNER_TEMP}/pnpm-bootstrap/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 打包
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.label }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage

  publish:
    name: 汇总安装包与发布
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
